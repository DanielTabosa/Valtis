# Integração contínua: todo push e pull request roda os testes do backend
# (com Postgres real via Testcontainers) e o build e o lint do frontend.
#
# Atenção: o Railway e a Vercel publicam a main por conta própria, sem esperar
# este CI. Para o CI barrar deploy quebrado, trabalhe em branch e só faça merge
# na main com o CI verde (ou ligue "Wait for CI" no Railway).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes (unitários e de integração)
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (inclui checagem de tipos)
        run: npm run build
